<mat-card class="card-container">
  <div class="header-actions">
    <h2>Estoque de Produtos</h2>
    <button mat-raised-button color="primary" routerLink="/produtos/novo">
      <mat-icon>add</mat-icon> Novo Produto
    </button>
  </div>

  <div class="table-responsive">
    <table mat-table [dataSource]="produtos()" class="mat-elevation-z2 full-width-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let p"> {{ p.id }} </td>
      </ng-container>

      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let p"> <strong>{{ p.codigo }}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let p"> {{ p.descricao }} </td>
      </ng-container>

      <ng-container matColumnDef="saldo">
        <th mat-header-cell *matHeaderCellDef> Saldo em Estoque </th>
        <td mat-cell *matCellDef="let p">
          <span [class.alerta-baixo]="p.saldo <= 0">{{ p.saldo }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="accent" [routerLink]="['/produtos/editar', p.id]" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="excluir(p.id)" title="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas;"></tr>
    </table>
  </div>
</mat-card>
